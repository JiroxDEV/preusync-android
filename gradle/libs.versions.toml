[versions]
agp = "9.4.0"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.14.0"
gson = "2.14.0"
okhttp = "5.0.0-alpha.14"
lifecycle = "2.11.0"
work = "2.11.2"
room = "2.8.4"
activity = "1.13.0"
fragment = "1.8.9"
startup = "1.2.0"
glide = "5.0.0-rc01"
swiperefreshlayout = "1.2.0-alpha01"
splashscreen = "1.2.0-alpha02"
commons-codec = "1.18.0"
prism4j = "2.0.0"
commonmark = "0.24.0"
jlatexmath = "0.2.0"
renderscript-toolkit = "b6363490c3"
retrofit = "2.11.0"
okhttp-logging = "5.0.0-alpha.14"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
startup = { group = "androidx.startup", name = "startup-runtime", version.ref = "startup" }
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
glide-compiler = { group = "com.github.bumptech.glide", name = "compiler", version.ref = "glide" }
swiperefreshlayout = { group = "androidx.swiperefreshlayout", name = "swiperefreshlayout", version.ref = "swiperefreshlayout" }
splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }
commons-codec = { group = "commons-codec", name = "commons-codec", version.ref = "commons-codec" }
prism4j = { group = "io.noties", name = "prism4j", version.ref = "prism4j" }
commonmark = { group = "org.commonmark", name = "commonmark", version.ref = "commonmark" }
jlatexmath = { group = "ru.noties", name = "jlatexmath-android", version.ref = "jlatexmath" }
renderscript-toolkit = { group = "com.github.android", name = "renderscript-intrinsics-replacement-toolkit", version.ref = "renderscript-toolkit" }
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp-logging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

